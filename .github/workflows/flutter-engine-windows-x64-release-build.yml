name: Build Flutter Engine

on: workflow_dispatch

permissions: write-all

# Pin to the exact engine revision that stock Flutter 3.44.7 ships, so the
# resulting gen_snapshot.exe / flutter_windows.dll are ABI-compatible with the
# 3.44.7 SDK's frontend_server (Dart 3.12.2). Building the wrong revision yields
# a "Invalid kernel binary format version" failure during `flutter build windows`.
env:
  ENGINE_REVISION: "69c8c61792f04cc809dfef0c910414fb9afc06cd"

jobs:
  build-engine:
    runs-on: windows-2022

    steps:
      - name: Install Depot Tools
        uses: newkdev/setup-depot-tools@v1.0.1

      - name: Set environment variables
        run: |
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          echo "GYP_MSVS_OVERRIDE_PATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise" >> $env:GITHUB_ENV
          echo "WINDOWSSDKDIR=C:\Program Files (x86)\Windows Kits\10" >> $env:GITHUB_ENV
          echo "CL=/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" >> $env:GITHUB_ENV

      - name: Fetch Flutter engine at pinned revision
        run: |
          $ErrorActionPreference = "Stop"
          mkdir engine
          cd engine

          fetch flutter
          if ($LASTEXITCODE -ne 0) { throw "fetch flutter failed" }

          # Make sure the pinned engine revision is available, then check it out.
          git -C src/flutter fetch --tags --force origin
          git -C src/flutter checkout $env:ENGINE_REVISION
          if ($LASTEXITCODE -ne 0) { throw "Failed to checkout engine revision $env:ENGINE_REVISION (must match stock Flutter 3.44.7)" }

          # Verify we are exactly on the intended engine revision.
          $head = (git -C src/flutter rev-parse HEAD).Trim()
          Write-Host "engine src/flutter HEAD = $head"
          if (-not $head.StartsWith($env:ENGINE_REVISION)) {
            throw "Checked-out engine HEAD ($head) does not match expected $env:ENGINE_REVISION"
          }

          # --- Patch: fix flutter/flutter#155685 (Windows multi-window EGL context
          #     crash on window create/close). ClearCurrent -> MakeCurrent. ---
          $filePath = "src/flutter/shell/platform/windows/flutter_windows_engine.cc"
          if (Test-Path $filePath) {
            (Get-Content $filePath) -replace 'ClearCurrent', 'MakeCurrent' | Set-Content $filePath
            Write-Host "Applied #155685 ClearCurrent->MakeCurrent patch to $filePath"
          } else {
            Write-Warning "Patch target $filePath not found at revision $env:ENGINE_REVISION; skipping #155685 patch"
          }

          # --- Patch: MSVC needs <string> before <string_view> in hex_codec.h ---
          $filePath = "src/flutter/fml/hex_codec.h"
          if (Test-Path $filePath) {
            (Get-Content $filePath | ForEach-Object { if ($_ -eq '#include <string_view>') {"#include <string>`n" + $_} else {$_}}) | Set-Content $filePath
            Write-Host "Applied hex_codec.h <string> include fix"
          }

          git -C src/flutter status

          gclient sync -D
          if ($LASTEXITCODE -ne 0) { throw "gclient sync failed" }

          # Compiling the Flutter engine
          cd src
          python .\flutter\tools\gn --runtime-mode=release --no-prebuilt-dart-sdk
          if ($LASTEXITCODE -ne 0) { throw "gn failed" }
          ninja -C .\out\host_release
          if ($LASTEXITCODE -ne 0) { throw "ninja build failed" }

          # Check and compress files
          $outputPath = "${{ github.workspace }}\windows-x64-release.zip"
          $filesToCompress = Get-ChildItem -Path .\out\host_release\ | Where-Object { $_.Name -in @("flutter_windows.dll", "flutter_windows.dll.pdb", "flutter_windows.dll.exp", "flutter_windows.dll.lib", "flutter_windows.h", "flutter_export.h", "flutter_messenger.h", "flutter_plugin_registrar.h", "flutter_texture_registrar.h", "license.windows_flutter.md", "gen_snapshot.exe") }
          $filesToCompressPaths = $filesToCompress.FullName
          if ($filesToCompressPaths) {
            Compress-Archive -Path $filesToCompressPaths -DestinationPath $outputPath
          } else {
            Write-Error "Build output files not found!"
          }

      - name: Upload zip to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: windows-x64-release.zip

      # The file will be uploaded to the release page of the repository, and the tag is the branch name of the currently executing workflow.
      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: windows-x64-release.zip
          tag: ${{ github.ref }}
          overwrite: true
          body: "Flutter Engine Release (pinned to engine revision 69c8c617 = stock Flutter 3.44.7, with #155685 multi-window fix)"
